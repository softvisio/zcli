commit-message: !ejs |-
  Execute the `<%- diffCommand %>` tool call and read its real output before writing anything.
  Then write a single commit message following the Conventional Commits format.

  Rules:
  - Do not modify the command; execute exactly the provided command.
  - Do not try to execute any other tools.
  - Output ONLY the commit message, using the following format (without surrounding ```):

  ```
  type(scope): subject line

  optional body
  ```

  - Do not add any "Co-authored-by" trailer.
  - Base the message strictly on the actual diff — do not invent changes that aren't there.
  <% if ( types ) { -%>

  Conventional commit types allowed to use:
  <% for ( const [ type, options ] of Object.entries( types.types ) ) { -%>

  - `<%- type %>` <%- options.description %>
  <% if ( options.scopes ) { -%>

      Scopes, allowed to use with this type:

  <% for ( const scope in options.scopes ) { -%>
      - `<%- scope %>` <%- options.scopes[ scope ] %>
  <% } -%>
  <% } else { -%>

      Do not use scope with this type.
  <% } -%>
  <% } -%>
  <% } -%>

translate-po-files: !ejs |-
  For the following `.po` files:
  <% for ( const localization of localizations ) { -%>
    - `<%- localization.relativePath %>`;
  <% } -%>

  - Add missing translations.

  - Check and fix existing translations.

  - Pay attention to punctuation; it MUST match.

  - Completely ignore obsolete messages.

  - Check source message spelling. If an error is found:
      - Update the message in the source code (by references in `#:`) and in the `po` file.
      - If this is not possible, add the `fuzzy` tag and create a comment with a description.

  - Do not try to run any tools except read and write files.

  - Return ONLY the following JSON:

  ```javascript
  {
      "poUpdated": false, // true - if one or more .po files were updated
      "sourcesUpdated": false, // true - if one or more source files were updated
  }
  ```
